<!-- Group linux-journald: Linux hosts WITHOUT rsyslog (e.g. minimal Debian 12), where
     SSH/sudo/su events exist only in journald. Needs Wazuh agent 4.8+ (journald log format).
     Use together with group linux. -->
<agent_config os="Linux">
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
    <filter field="SYSLOG_IDENTIFIER">^(sshd|sudo|su|systemd-logind|useradd|userdel|usermod|groupadd|passwd|chpasswd)$</filter>
  </localfile>
</agent_config>
