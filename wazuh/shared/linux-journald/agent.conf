<!-- Група linux-journald: Linux-хости БЕЗ rsyslog (наприклад, мінімальний Debian 12), де
     події SSH/sudo/su є лише в journald. Потрібен агент Wazuh 4.8+ (формат журналу journald).
     Використовуйте разом із групою linux. -->
<agent_config os="Linux">
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
    <filter field="SYSLOG_IDENTIFIER">^(sshd|sudo|su|systemd-logind|useradd|userdel|usermod|groupadd|passwd|chpasswd)$</filter>
  </localfile>
</agent_config>
