<!-- Група windows-dc: лише контролери домену, додатково до групи windows -->
<!-- Згенеровано зі списку каналів windows/Set-SecurityLogging.ps1. Application/Security/System уже є в стандартному ossec.conf агента. -->
<agent_config os="Windows">
  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-DNSServer/Audit</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>DFS Replication</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
