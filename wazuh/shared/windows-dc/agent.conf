<!-- Group windows-dc: domain controllers only, in addition to group windows -->
<!-- Generated from windows/Set-SecurityLogging.ps1 channel list. Application/Security/System are in the default agent ossec.conf. -->
<agent_config os="Windows">
  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-DNSServer/Audit</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>DFS Replication</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
