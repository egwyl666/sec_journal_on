<!-- Група linux: усі Linux-агенти. Відсутні файли logcollector пропускає. -->
<agent_config os="Linux">
  <!-- auditd (правила з linux/set-security-logging.sh; ключ audit-wazuh-c = виконані команди) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>
  <!-- SSH / sudo / su: Debian/Ubuntu -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <!-- SSH / sudo / su: сімейство RHEL -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>
</agent_config>

<!-- Sysmon for Linux (лише хости, де скрипт запускали з параметром with-sysmon): події йдуть у syslog, тег "sysmon".
     Для цих XML-подій Wazuh потрібні додаткові декодери; додайте їх, перш ніж вмикати цей блок.
<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>
</agent_config>
-->
