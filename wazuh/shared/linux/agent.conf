<!-- Group linux: all Linux agents. Missing files are skipped by logcollector. -->
<agent_config os="Linux">
  <!-- auditd (rules from linux/set-security-logging.sh; key audit-wazuh-c = executed commands) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>
  <!-- SSH / sudo / su: Debian/Ubuntu -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <!-- SSH / sudo / su: RHEL family -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>
</agent_config>

<!-- Sysmon for Linux (only hosts where the script ran with the with-sysmon option): events go to syslog, tag "sysmon".
     Wazuh needs extra decoders for these XML events; add them before enabling this block.
<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>
</agent_config>
-->
